<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Nexora</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f4f5fb; --text:#12162a; --muted:#5b6478; --border:rgba(15,23,42,.09); --grad:linear-gradient(92deg,#2563eb,#8b5cf6 55%,#ec4899); }
    [data-theme="dark"] { --bg:#090b12; --text:#fafafa; --muted:#8b93a7; --border:rgba(255,255,255,.08); --grad:linear-gradient(92deg,#5b8cff,#a78bfa 55%,#f472b6); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .orbs { position:fixed; inset:0; z-index:0; background:radial-gradient(700px 400px at 80% 0%,rgba(139,92,246,.12),transparent 60%),radial-gradient(600px 380px at 10% 100%,rgba(59,130,246,.10),transparent 60%); }
    .card { position:relative; z-index:1; text-align:center; padding:3.5rem 2.5rem; background:color-mix(in srgb, #fff 72%, transparent); border:1px solid var(--border); border-radius:24px; box-shadow:0 24px 60px rgba(30,41,82,.12); max-width:520px; margin:0 16px; }
    [data-theme="dark"] .card { background:rgba(17,19,30,.9); box-shadow:0 24px 64px rgba(0,0,0,.45); }
    .code { font-size:5.5rem; font-weight:900; letter-spacing:-.05em; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1; }
    h1 { font-size:1.5rem; font-weight:800; margin-top:1rem; }
    p { color:var(--muted); margin-top:.7rem; font-size:.95rem; line-height:1.65; }
    .btns { display:flex; gap:12px; justify-content:center; margin-top:1.8rem; flex-wrap:wrap; }
    a.btn { text-decoration:none; font-weight:600; font-size:.9rem; padding:.7rem 1.4rem; border-radius:12px; transition:transform .2s ease, box-shadow .2s ease; }
    a.btn:hover { transform:translateY(-2px); }
    .primary { background:var(--grad); color:#fff; box-shadow:0 10px 30px rgba(139,92,246,.3); }
    .ghost { background:var(--bg); border:1px solid var(--border); color:var(--text); }
  </style>
  <script>
    (function () {
      try { var t = localStorage.getItem('nx-theme'); if (t === 'dark') document.documentElement.setAttribute('data-theme','dark'); } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="orbs"></div>
  <div class="card">
    <div class="code">404</div>
    <h1>This file isn't in the workspace</h1>
    <p>The page you're looking for was moved, renamed, or never existed. Head back to the landing page or browse the documentation.</p>
    <div class="btns">
      <a class="btn primary" href="index.html">← Back to homepage</a>
      <a class="btn ghost" href="docs.html">Read the docs</a>
    </div>
  </div>
</body>
</html>
