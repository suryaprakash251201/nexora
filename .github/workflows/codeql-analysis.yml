# CodeQL Security Analysis
#
# Runs GitHub's CodeQL static analysis on every push to main and every
# pull request targeting main. Results appear in the Security > Code
# scanning tab.
#
# See: https://docs.github.com/en/code-security/code-scanning

name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC

# Default: none — each job declares what it needs.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    permissions:
      actions: read       # required to list cached analysis packs
      contents: read      # required to check out the code
      security-events: write  # required to upload SARIF results
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initialises the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Auto-build for Go; no build needed for JS/TS.
      - name: AutoBuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
