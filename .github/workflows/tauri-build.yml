name: 'Build Tauri Apps'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create a release for (leave empty for build-only)'
        required: false
        type: string

# Default permissions: none — each job declares only what it needs.
permissions: {}

jobs:
  build-tauri:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu 22.04)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libnotify-dev libssl-dev rpm

      - name: install dependencies (ubuntu 24.04)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libnotify-dev libssl-dev rpm

      - name: install web dependencies
        run: npm install
        working-directory: ./web

      - name: install desktop dependencies
        run: npm install
        working-directory: ./desktop

      - name: generate app icons from favicon
        run: |
          cp ../web/public/favicon.svg src-tauri/icons/app-icon.svg
          npx --yes @tauri-apps/cli icon src-tauri/icons/app-icon.svg -o src-tauri/icons
        working-directory: ./desktop

      # Build-only: tagName/releaseName/releaseId are intentionally omitted so
      # tauri-action never touches GitHub Releases. Publishing happens exactly
      # once, in the dedicated `release` job below — this avoids the upstream
      # race where parallel matrix legs delete/upload the same release assets
      # concurrently (sporadic "Not Found - delete-a-release-asset" 404s).
      - name: build tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: './desktop'
          args: ${{ matrix.args }}

      - name: upload linux bundles
        if: startsWith(matrix.platform, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: nexora-desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 7

      - name: upload windows bundles
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nexora-desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 7

  # Publish a GitHub release from the built bundles, once, when a v* tag is pushed.
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
    needs: build-tauri
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Nexora Desktop ${{ github.event.inputs.release_tag || github.ref_name }}
          body: 'See the assets to download this version and install.'
          draft: false
          prerelease: false
          files: |
            bundles/**/*.deb
            bundles/**/*.rpm
            bundles/**/*.AppImage
            bundles/**/*.exe
            bundles/**/*.msi
            bundles/**/*.sig
