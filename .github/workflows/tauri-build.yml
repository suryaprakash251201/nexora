name: 'Build Tauri Apps'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create a release for (leave empty for build-only)'
        required: false
        type: string

# Default permissions: none — each job declares only what it needs.
permissions: {}

jobs:
  build-tauri:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The native audio engine (nexora-audio: symphonia decode +
          # rodio output) ships on every desktop target. Windows (WASAPI)
          # and macOS (CoreAudio) need no extra system libraries; Linux
          # (ALSA) needs libasound2-dev, installed in the apt steps below.
          - platform: 'ubuntu-22.04'
            args: '--features native-audio'
          - platform: 'ubuntu-24.04'
            args: '--features native-audio'
          - platform: 'windows-latest'
            args: '--features native-audio'
          - platform: 'macos-latest'
            args: '--features native-audio'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu 22.04)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libnotify-dev libssl-dev libasound2-dev rpm

      - name: install dependencies (ubuntu 24.04)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libnotify-dev libssl-dev libasound2-dev rpm

      - name: install web dependencies
        run: npm ci
        working-directory: ./web

      - name: install desktop dependencies
        run: npm ci
        working-directory: ./desktop

      - name: generate app icons from favicon
        run: |
          cp ../web/public/favicon.svg src-tauri/icons/app-icon.svg
          npx --yes @tauri-apps/cli icon src-tauri/icons/app-icon.svg -o src-tauri/icons
        working-directory: ./desktop

      # Build-only: tagName/releaseName/releaseId are intentionally omitted so
      # tauri-action never touches GitHub Releases. Publishing happens exactly
      # once, in the dedicated `release` job below — this avoids the upstream
      # race where parallel matrix legs delete/upload the same release assets
      # concurrently (sporadic "Not Found - delete-a-release-asset" 404s).
      - name: build tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: './desktop'
          args: ${{ matrix.args }}

      - name: upload linux bundles
        if: startsWith(matrix.platform, 'ubuntu')
        uses: actions/upload-artifact@v7
        with:
          name: nexora-desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/deb/*.sig
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/rpm/*.sig
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.sig
          if-no-files-found: warn
          retention-days: 7

      - name: upload windows bundles
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nexora-desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.sig
          if-no-files-found: warn
          retention-days: 7

      - name: upload macos bundles
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: nexora-desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn
          retention-days: 7

  # Publish a GitHub release from the built bundles, once, when a v* tag is pushed.
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
    needs: build-tauri
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: bundles
          merge-multiple: true

      # The updater plugin polls releases/latest/download/updater.json, but
      # tauri-action in build-only mode emits only bundles + .sig files —
      # nothing ever published the manifest, so desktop auto-update was
      # silently dead. Assemble it here from the signed artifacts.
      - name: build updater manifest
        run: >-
          node desktop/scripts/make-updater-json.mjs --dir bundles
          --tag "${{ github.event.inputs.release_tag || github.ref_name }}"
          --repo "${{ github.repository }}" --out bundles/updater.json

      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Nexora Desktop ${{ github.event.inputs.release_tag || github.ref_name }}
          body: 'See the assets to download this version and install.'
          draft: false
          prerelease: false
          files: |
            bundles/**/*.deb
            bundles/**/*.rpm
            bundles/**/*.AppImage
            bundles/**/*.exe
            bundles/**/*.msi
            bundles/**/*.dmg
            bundles/**/*.app.tar.gz
            bundles/**/*.sig
            bundles/updater.json
