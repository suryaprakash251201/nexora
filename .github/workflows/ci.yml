name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Default permissions: none — each job declares only what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Versioned install avoids stale local binaries that can't read
          # Go 1.2x export data. Config: .golangci.yml (gofmt, goimports,
          # govet, errcheck, staticcheck, unused, ineffassign, typecheck).
          version: latest

  backend:
    name: Backend (vet + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: go build (server)
        run: go build -o /tmp/nexora ./cmd/nexora

      - name: go build (postgres tag)
        run: go build -tags postgres -o /tmp/nexora-pg ./cmd/nexora

  postgres:
    name: Postgres migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Run postgres migrations + integration test
        env:
          NEXORA_TEST_POSTGRES_URL: postgres://nexora:nexora@localhost:5432/nexora_test?sslmode=disable
        run: go test -tags postgres -run TestRunPostgres ./migrations -count=1 -v

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Rules of Hooks (AST check)
        run: npm run lint:hooks

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Bundle size gate
        run: npm run size

  patches:
    name: Patches (mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify patches apply
        run: npx patch-package --error-on-fail

      - name: Rules of Hooks (AST check)
        run: npm run lint:hooks

  core:
    name: Shared core (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/core
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install TypeScript
        run: npm install --no-save typescript@~5.9.2

      - name: Type check
        run: npx tsc --noEmit

  desktop-audio:
    name: Native audio engine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri/crates/nexora-audio
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-audio-${{ hashFiles('desktop/src-tauri/crates/nexora-audio/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-audio-

      - name: "Tests (headless: source + decode features)"
        run: cargo test --features decode --locked

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --features decode -- -D warnings
