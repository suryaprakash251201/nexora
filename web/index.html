<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#090B12" />
    <title>Nexora — Your private file workspace</title>
    <style>
      /* Static boot splash — painted before the JS bundle loads so a fresh
         URL / refresh shows the app logo immediately (no white flash). */
      html, body { background: #090B12; margin: 0; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(1200px 800px at 50% -10%, #121a30 0%, #0b0e1a 50%, #070810 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      }
      #boot-splash .bs-inner { display: flex; flex-direction: column; align-items: center; gap: 28px; }
      #boot-splash .bs-logo-wrap { position: relative; width: 128px; height: 128px; display: grid; place-items: center; }
      #boot-splash .bs-ring { position: absolute; inset: 0; animation: bs-spin 1.1s linear infinite; }
      #boot-splash .bs-logo {
        width: 96px; height: 96px;
        animation: bs-pop .7s cubic-bezier(.22, 1, .36, 1) both;
        filter: drop-shadow(0 8px 24px rgba(139, 92, 246, .45));
      }
      #boot-splash .bs-name {
        font-size: 26px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1;
        background: linear-gradient(90deg, #5b8cff, #a78bfa, #f472b6);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: bs-pulse 2.2s ease-in-out infinite;
      }
      #boot-splash .bs-tag { font-size: 13px; color: #8b93a7; letter-spacing: .02em; margin-top: 6px; text-align: center; }
      #boot-splash .bs-bar { width: 200px; height: 3px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
      #boot-splash .bs-bar-fill {
        height: 100%; border-radius: 999px;
        background: linear-gradient(90deg, #5b8cff, #a78bfa, #f472b6);
        animation: bs-bar 1.9s cubic-bezier(.4, 0, .2, 1) forwards;
      }
      @keyframes bs-spin { to { transform: rotate(360deg); } }
      @keyframes bs-pop {
        0%   { opacity: 0; transform: scale(.82) translateY(12px); }
        60%  { opacity: 1; transform: scale(1.04); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes bs-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
      @keyframes bs-bar { 0% { width: 0%; } 65% { width: 62%; } 100% { width: 88%; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bs-ring, #boot-splash .bs-logo, #boot-splash .bs-name, #boot-splash .bs-bar-fill { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="bs-inner">
        <div class="bs-logo-wrap">
          <svg class="bs-ring" viewBox="0 0 36 36">
            <defs>
              <linearGradient id="bs-rg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#5B8CFF"/>
                <stop offset="55%" stop-color="#8B5CF6"/>
                <stop offset="100%" stop-color="#EC4899"/>
              </linearGradient>
            </defs>
            <circle cx="18" cy="18" r="16.6" fill="none" stroke="url(#bs-rg)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="72 33" opacity="0.85"/>
          </svg>
          <svg class="bs-logo" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bs-lg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3B82F6"/>
                <stop offset="25%" stop-color="#6366F1"/>
                <stop offset="50%" stop-color="#8B5CF6"/>
                <stop offset="75%" stop-color="#D946EF"/>
                <stop offset="100%" stop-color="#EC4899"/>
              </linearGradient>
              <linearGradient id="bs-ls" x1="50%" y1="0%" x2="50%" y2="100%">
                <stop offset="0%" stop-color="white" stop-opacity="0.5"/>
                <stop offset="40%" stop-color="white" stop-opacity="0.15"/>
                <stop offset="100%" stop-color="white" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <path d="M18 2 L32 8 L32 20 C32 29 26 34 18 36 C10 34 4 29 4 20 L4 8 Z" fill="url(#bs-lg)"/>
            <path d="M18 2 L32 8 L32 20 C32 29 26 34 18 36 C10 34 4 29 4 20 L4 8 Z" fill="url(#bs-ls)"/>
            <text x="18" y="25" text-anchor="middle" fill="white" font-size="22" font-weight="900" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" letter-spacing="-0.05em">N</text>
          </svg>
        </div>
        <div>
          <div class="bs-name">Nexora</div>
          <div class="bs-tag">Your private file workspace</div>
        </div>
        <div class="bs-bar"><div class="bs-bar-fill"></div></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
