[package]
name = "nexora-audio"
version = "0.1.0"
edition = "2021"
description = "Native audio playback engine for the Nexora Tauri desktop client: HTTP-Range streaming source, symphonia decoding, rodio/WASAPI output."
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
# Output via rodio/cpal (WASAPI on Windows, ALSA/Pulse on Linux). Kept behind a
# feature so CI and headless environments can run the full test suite without
# audio device libraries installed.
output = ["dep:rodio"]
# Decode pipeline (symphonia). Separate from `output` so source/decoder logic
# is testable without audio hardware.
decode = ["dep:symphonia"]

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
symphonia = { version = "0.5", optional = true, default-features = false, features = [
    "isomp4", "alac", "aac", "flac", "pcm", "mp3",
] }
rodio = { version = "0.20", optional = true, default-features = false, features = [] }

thiserror = "1"

[dev-dependencies]
tiny_http = "0.12"

[[test]]
name = "range_reader"
path = "tests/range_reader.rs"
