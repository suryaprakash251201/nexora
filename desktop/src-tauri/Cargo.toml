[package]
name = "nexora-desktop"
version = "1.10.0"
description = "Nexora Desktop - Native file management"
authors = ["suryaprakash251201"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-upload = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2.4"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
nexora-audio = { path = "crates/nexora-audio", optional = true }

[features]
# Native in-app audio engine (symphonia decode + rodio/WASAPI output).
# Windows/macOS release builds enable this; Linux dev boxes need
# libasound2-dev + pkg-config for the cpal/ALSA backend.
native-audio = ["dep:nexora-audio", "nexora-audio/decode", "nexora-audio/output"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.11"

# SECURITY: GHSA-wrw7-89jp-8q8g / RUSTSEC-2024-0429 — unsound `&p` -> `&mut p`
# in `glib::VariantStrIter::impl_get` (glib >= 0.15.0, < 0.20.0).
#
# Tauri 2 cannot reach the fixed glib: every 2.x release depends on
# `gtk ^0.18` (and wry 0.5x/tao 0.3x on `gdk`/`gdkx11` ^0.18), and cargo treats
# a caret requirement on a 0.x version as `>=0.18, <0.19`. glib 0.20+ is only
# reachable through gtk 0.19+, i.e. a gtk3 -> gtk4 port that Tauri 2 does not
# ship. gtk-rs-core never backported the fix to the 0.18 branch (its tip *is*
# the 0.18.5 tag), so we vendor a pristine 0.18.5 with only that one-line fix
# backported from upstream commit b5a4071e. Nothing in the desktop dependency
# tree calls `VariantStrIter`/`Variant::array_iter_str`, so this is a
# defense-in-depth backport that keeps the lockfile audit-clean; drop it once
# Tauri tracks gtk 0.19+.
[patch.crates-io]
glib = { path = "vendor/glib" }
