[package]
name = "nexora-desktop"
version = "1.9.0"
description = "Nexora Desktop - Native file management"
authors = ["suryaprakash251201"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-upload = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
nexora-audio = { path = "crates/nexora-audio", optional = true }

[features]
# Native in-app audio engine (symphonia decode + rodio/WASAPI output).
# Windows/macOS release builds enable this; Linux dev boxes need
# libasound2-dev + pkg-config for the cpal/ALSA backend.
native-audio = ["dep:nexora-audio", "nexora-audio/decode", "nexora-audio/output"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
